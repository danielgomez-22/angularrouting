@for (item of [].constructor(3); track $index){
    <a [routerLink] = "['/doble', $index + 5]"> Doble {{$index + 5}}</a>
}

    <h2 syle="color: blue;">El doble del numero {{numero}} es {{doble}}</h2>
}@else{
    <h2 syle="color: red;">No se ha proporcionado un número</h2>
}
